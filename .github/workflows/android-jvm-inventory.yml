# Resolver controls only. No Nexus native build, signing, binary upload or legal pass.
name: Android JVM runtime inventory controls

on:
  workflow_dispatch:
  push:
    branches: [codex/android-arm64]
    paths:
      - .github/workflows/android-jvm-inventory.yml
      - scripts/android-jvm-inventory.gradle
      - scripts/android_jvm_inventory_test.py
      - src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

permissions:
  contents: read

concurrency:
  group: android-jvm-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolver-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use the runner Java 17, without changing any local environment
        shell: bash
        run: |
          set -euo pipefail
          java="${JAVA_HOME_17_X64:?Runner Java 17 required}"
          test -x "$java/bin/java"
          printf 'JAVA_HOME=%s\n' "$java" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$java" >> "$GITHUB_PATH"
      - name: Stage the exact official Gradle distribution already pinned by the Android host
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          curl --fail --show-error --location --retry 3 --proto '=https' \
            https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$file"
          printf '%s  %s\n' bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531 "$file" | sha256sum -c -
          unzip -q "$file" -d "$RUNNER_TEMP/nexus-gradle-controls"
          printf 'NEXUS_TEST_GRADLE=%s\n' "$RUNNER_TEMP/nexus-gradle-controls/gradle-8.14.3/bin/gradle" >> "$GITHUB_ENV"
      - name: Resolve real local Maven/project fixtures and enforce missing-artifact and wrong-graph controls
        run: python3 -m unittest discover -s scripts -p android_jvm_inventory_test.py -v

      - name: Prove actual Gradle notices regression catches the previous filename matcher
        shell: bash
        run: |
          set -euo pipefail
          source=scripts/android-jvm-inventory.gradle
          backup=$(mktemp "$RUNNER_TEMP/nexus-jvm-notices.XXXXXX")
          cp "$source" "$backup"
          trap 'cp "$backup" "$source"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/android-jvm-inventory.gradle')
          source = path.read_text()
          needle = r'([^\/]*[._-])?'
          assert source.count(needle) == 1
          path.write_text(source.replace(needle, ''))
          PY
          set +e
          python3 -m unittest discover -s scripts -p android_jvm_inventory_test.py -k component_prefixed -v > "$RUNNER_TEMP/notices-negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/notices-negative.log"
          test "$status" -ne 0
          grep -F 'FAIL: test_component_prefixed_notice_entries_are_hashed_by_actual_gradle' "$RUNNER_TEMP/notices-negative.log"
          grep -F 'META-INF/fixture-core-LICENSE' "$RUNNER_TEMP/notices-negative.log"
          cp "$backup" "$source"
          trap - EXIT

      - name: Prove the actual nested-build guard prevents the observed buildSrc regression
        shell: bash
        run: |
          set -euo pipefail
          source=scripts/android-jvm-inventory.gradle
          backup=$(mktemp "$RUNNER_TEMP/nexus-jvm-inventory.XXXXXX")
          cp "$source" "$backup"
          trap 'cp "$backup" "$source"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/android-jvm-inventory.gradle')
          source = path.read_text()
          needle = '    if (gradle.parent != null) return\n'
          assert source.count(needle) == 1
          path.write_text(source.replace(needle, ''))
          PY
          set +e
          python3 -m unittest discover -s scripts -p android_jvm_inventory_test.py -k buildsrc -v > "$RUNNER_TEMP/inventory-negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/inventory-negative.log"
          test "$status" -ne 0
          grep -F 'FAIL: test_buildsrc_initialization_cannot_be_mistaken_for_the_application' "$RUNNER_TEMP/inventory-negative.log"
          grep -F 'Actual :app project required for runtime inventory' "$RUNNER_TEMP/inventory-negative.log"
          cp "$backup" "$source"
          trap - EXIT

      - name: Prove omitting real project artifact producers breaks byte-level inventory
        shell: bash
        run: |
          set -euo pipefail
          source=scripts/android-jvm-inventory.gradle
          backup=$(mktemp "$RUNNER_TEMP/nexus-jvm-producer.XXXXXX")
          cp "$source" "$backup"
          trap 'cp "$backup" "$source"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/android-jvm-inventory.gradle')
          source = path.read_text()
          needle = "            runtimeArtifacts.artifactFiles.buildDependencies"
          assert source.count(needle) == 1
          path.write_text(source.replace(needle, '            []'))
          PY
          set +e
          python3 -m unittest discover -s scripts -p android_jvm_inventory_test.py -k project_artifact_producer -v > "$RUNNER_TEMP/producer-negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/producer-negative.log"
          test "$status" -ne 0
          grep -F 'FAIL: test_project_artifact_producer_runs_before_its_actual_bytes_are_hashed' "$RUNNER_TEMP/producer-negative.log"
          grep -F 'bridge.jar' "$RUNNER_TEMP/producer-negative.log"
          cp "$backup" "$source"
          trap - EXIT

      - name: Prove dropping the typed runtime view reproduces project variant ambiguity
        shell: bash
        run: |
          set -euo pipefail
          source=scripts/android-jvm-inventory.gradle
          backup=$(mktemp "$RUNNER_TEMP/nexus-jvm-variants.XXXXXX")
          cp "$source" "$backup"
          trap 'cp "$backup" "$source"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/android-jvm-inventory.gradle')
          source = path.read_text()
          needle = '        it.attributes.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, inputArtifactType)\n'
          assert source.count(needle) == 1
          path.write_text(source.replace(needle, ''))
          PY
          set +e
          python3 -m unittest discover -s scripts -p android_jvm_inventory_test.py -k typed_view -v > "$RUNNER_TEMP/variants-negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/variants-negative.log"
          test "$status" -ne 0
          grep -F 'FAIL: test_typed_view_selects_runtime_bytes_and_producer_among_project_metadata_variants' "$RUNNER_TEMP/variants-negative.log"
          grep -F 'Release runtime input resolution incomplete' "$RUNNER_TEMP/variants-negative.log"
          cp "$backup" "$source"
          trap - EXIT
