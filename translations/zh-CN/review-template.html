<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus 简体中文 · 中英文对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#192531;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:30px}h1{font-size:28px;margin:0 0 6px}.muted{color:#617083}header{margin-bottom:24px}.bar{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0;align-items:center}input,select,button{font:inherit;padding:9px 12px;border:1px solid #cbd3de;border-radius:6px;background:white}input{flex:1;min-width:240px}button{cursor:pointer}button:disabled{opacity:.4}table{border-collapse:collapse;width:100%;background:white;table-layout:fixed}th,td{padding:14px;text-align:left;vertical-align:top;border:1px solid #dde3ea;white-space:pre-wrap;overflow-wrap:anywhere}th{background:#e9eff5}th:first-child{width:24%}th:nth-child(2){width:38%}code{font-size:12px;color:#52677d}.state{font-size:12px;display:block;margin-top:8px}.draft{color:#8b5900}.reference{color:#6953a6}.reviewed{color:#18724f}small{display:block;color:#64748b;font-size:11px;margin-top:10px}textarea{font:inherit;width:100%;min-height:90px;resize:vertical;border:1px solid #d3dce5;padding:8px;border-radius:5px}label{font-size:12px;color:#52677d}label input{min-width:0}.foot{display:flex;gap:16px;align-items:center;margin-top:18px}@media(max-width:750px){main{padding:12px}th,td{padding:7px;font-size:12px}}
</style>
<main><header><h1>Nexus 简体中文 · 中英文对照</h1><div id="summary" class="muted"></div><p>初译和参考候选均需按界面语境校对。已校对包含模型语义校对，不代表第三方独立人工确认。空白表示待翻译。此表未接入应用，也不代表已产出中文版安装包。</p><div class="muted">保留频率、呼号、模式名、宏变量及 {{占位符}}。本页支持离线搜索和编辑；关闭前请导出，编辑内容不会自动保存。</div></header>
<div class="bar"><input id="query" placeholder="搜索词条键、英文或中文"><select id="status"><option value="">全部状态</option><option value="untranslated">待翻译</option><option value="draft">本地初译</option><option value="reference">参考候选</option><option value="reviewed">已校对</option></select><button id="export">导出当前对照 JSON</button></div>
<div id="count" class="muted"></div><table><thead><tr><th>位置与状态</th><th>英文原文</th><th>简体中文</th></tr></thead><tbody id="body"></tbody></table>
<div class="foot"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></main>
<script>
const data=/*CATALOG*/null;
const names={untranslated:'待翻译',draft:'本地初译 · 待校对',reference:'参考候选 · 待校对',reviewed:'已校对'};
let page=0,filtered=data.rows;
const $=id=>document.getElementById(id);
$('summary').textContent=`版本 ${data.meta.version} · ${data.meta.commit.slice(0,7)} · ${data.meta.keys.toLocaleString()} 个键 · ${data.meta.messages.toLocaleString()} 条消息 + ${data.meta.splash} 条启动提示`;
function filter(){const q=$('query').value.trim().toLowerCase(),s=$('status').value;filtered=data.rows.filter(r=>(!s||r.status===s)&&(!q||[r.id,r.english,r.chinese].some(v=>v.toLowerCase().includes(q))));page=0;render()}
function render(){const body=$('body');body.replaceChildren();for(const r of filtered.slice(page*60,page*60+60)){const tr=document.createElement('tr');const a=document.createElement('td');const key=document.createElement('code');key.textContent=r.id;a.append(key);const st=document.createElement('span');st.className='state '+r.status;st.textContent=names[r.status];a.append(st);if(r.preserve.length){const small=document.createElement('small');small.textContent='保留：'+r.preserve.join(' · ');a.append(small)}const b=document.createElement('td');b.textContent=r.english;const c=document.createElement('td'),edit=document.createElement('textarea');edit.value=r.chinese;edit.setAttribute('aria-label',r.id+' 中文译文');const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=r.status==='reviewed';label.append(check,document.createTextNode(' 已按界面语境校对'));edit.oninput=()=>{r.chinese=edit.value;r.status=r.chinese.trim()?'draft':'untranslated';check.checked=false;st.textContent=names[r.status];st.className='state '+r.status};check.onchange=()=>{if(check.checked&&!edit.value.trim()){check.checked=false;return}r.status=check.checked?'reviewed':r.chinese?'draft':'untranslated';st.textContent=names[r.status];st.className='state '+r.status};c.append(edit,label);if(r.source){const src=document.createElement('small');src.textContent=r.source;c.append(src)}tr.append(a,b,c);body.append(tr)}$('count').textContent=`匹配 ${filtered.length.toLocaleString()} 条；共 ${data.rows.length.toLocaleString()} 条`;$('page').textContent=`${page+1} / ${Math.max(1,Math.ceil(filtered.length/60))}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*60>=filtered.length}
$('query').oninput=filter;$('status').onchange=filter;$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('export').onclick=()=>{data.meta.counts=Object.fromEntries(Object.keys(names).map(s=>[s,data.rows.filter(r=>r.status===s).length]));const blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nexus-zh-CN.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
