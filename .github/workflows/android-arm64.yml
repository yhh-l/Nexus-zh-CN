# Android ARM64 library + native-backend milestones. No APK/signing/publish/RF claim.
name: Android ARM64 portability

on:
  # A new workflow can run on its first approved branch push without changing main.
  push:
    branches: [codex/android-arm64]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-arm64-${{ github.ref }}
  # Preserve long-running UI/native evidence; a new approved revision waits its turn.
  cancel-in-progress: false

jobs:
  ui-mobile:
    name: Phone navigation + full UI regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the locked UI dependencies
        run: npm --prefix ui ci

      # Failing-first is also cloud-only: use the actual previous branch revision,
      # not a synthetic bad stylesheet. Restore both exact files on every exit.
      - name: Prove the mobile regression detects the previous implementation
        shell: bash
        run: |
          set -euo pipefail
          baseline=0386497e3f162b6c9a84a3348aac033a2cda8ac9
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$baseline"
          backup=$(mktemp -d "$RUNNER_TEMP/nexus-nav-baseline.XXXXXX")
          cp ui/src/components/ModeNav.tsx "$backup/ModeNav.tsx"
          cp ui/src/styles.css "$backup/styles.css"
          restore_nav() {
            cp "$backup/ModeNav.tsx" ui/src/components/ModeNav.tsx
            cp "$backup/styles.css" ui/src/styles.css
          }
          trap restore_nav EXIT
          git -C "$GITHUB_WORKSPACE" show "$baseline:ui/src/components/ModeNav.tsx" > ui/src/components/ModeNav.tsx
          git -C "$GITHUB_WORKSPACE" show "$baseline:ui/src/styles.css" > ui/src/styles.css
          export MOBILE_BASELINE_REPORT="$backup/results.json"
          set +e
          npm --prefix ui test -- src/components/ModeNav.mobile.test.tsx \
            --reporter=default --reporter=json --outputFile="$MOBILE_BASELINE_REPORT"
          status=$?
          set -e
          if [[ "$status" == 0 ]]; then
            echo 'Mobile regression did not detect the old implementation' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync(process.env.MOBILE_BASELINE_REPORT, 'utf8'));
          const cases = report.testResults.flatMap(suite => suite.assertionResults ?? []);
          console.log('Baseline results:', cases.map(test => ({ title: test.title, status: test.status })));
          for (const title of [
            'has one bounded strip and pinned Settings at xs',
            'reveals an external section change using zoom-correct horizontal movement only',
          ]) {
            assert(cases.some(test => test.title === title && test.status === 'failed'),
              `Baseline did not fail the intended regression: ${title}`);
          }
          assert(cases.some(test => test.title === 'preserves the desktop rail and desktop drag-to-reorder'
            && test.status === 'passed'), 'Baseline positive control did not execute and pass');
          console.log('Expected baseline failures and desktop positive control verified; restoring fixed sources.');
          NODE

      - name: Typecheck and build the complete UI
        run: npm --prefix ui run build

      # Fail quickly on the new mobile tests, but retain the ENTIRE suite below.
      - name: Run startup-page and mobile-navigation regressions first
        run: npm --prefix ui test -- src/android-start.test.ts src/components/ModeNav.mobile.test.tsx

      # Includes the rendered mobile-navigation tests, cascade guards and existing
      # stop-line sweeps. jsdom passing does not prove actual phone geometry.
      - name: Run the complete UI suite (including mobile navigation and Stop controls)
        run: npm --prefix ui test

  # Same compiled-browser coverage as ci.yml, cloud-only. This tests shared UI
  # geometry, not an Android host, native engine, real credentials or physical RF.
  browser-layout:
    name: Real Chrome layout regression (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Remote dependencies
        run: |
          npm --prefix ui ci
          npm --prefix remote ci
      - name: Build the hosted browser
        run: npm --prefix ui run build:remote
      # The browser fixture loads remote/dist/index.js, never unbundled source.
      - name: Bundle the Cloudflare service (the sweep loads dist/, not src/)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm --prefix remote run build
      # Reuse both full CI shards, not a narrower single-scenario smoke test.
      - name: Compiled browser sign-in, approval, observation and responsive layouts
        env:
          NEXUS_BROWSER_SHARD: ${{ matrix.shard }}
          NEXUS_BROWSER_SHARDS: "2"   # keep equal to the two shards above and to ci.yml
          NEXUS_REMOTE_BROWSER_ARTIFACTS: browser-artifacts
        run: |
          google-chrome --version
          npm --prefix remote run test:browser
      # Keep passing captures too: actual boxes can be inspected without rerunning.
      # A runner/setup failure with no screenshots must retain its original error.
      - name: Upload browser layout evidence (NOT Android WebView or device proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-browser-layout-shard-${{ matrix.shard }}
          path: remote/browser-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  portable-libraries:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up the pinned Rust Android target
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.93.1
          targets: aarch64-linux-android

      - name: Test archive and artifact guards
        run: node --test scripts/android-arm64.test.mjs

      - name: Test real Android native build dispatch (host-only guards)
        run: node --test scripts/android-native.test.mjs

      - name: Check desktop/mobile source boundaries (not runtime proof)
        run: node --test scripts/android-platform.test.mjs

      - name: Check Android host config without claiming a generated project or APK
        run: |
          node --test scripts/android-host-config.test.mjs
          node scripts/android-host-config.mjs

      - name: Compile real portable libraries for Android ARM64
        run: node scripts/android-arm64.mjs

      - name: Upload portable libraries and the explicit coverage report (NOT an APK)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-arm64-portable-libraries
          if-no-files-found: error
          retention-days: 14
          path: |
            target/android-arm64/build-report.json
            target/android-host/config-report.json
            target/android-arm64/aarch64-linux-android/debug/libtempo_base.rlib
            target/android-arm64/aarch64-linux-android/debug/libpropagation.rlib
            target/android-arm64/aarch64-linux-android/debug/libjs8.rlib

  native-backend:
    name: Real Android native modem + full backend check
    needs: portable-libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up the pinned Rust Android target
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.93.1
          targets: aarch64-linux-android
          components: rustfmt

      - name: Check standalone shell formatting before expensive native compilation
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Install the checked LLVM host compiler
        run: bash scripts/install-android-flang.sh

      - name: Cross-build Android FFTW and the real Flang runtime
        run: bash scripts/build-android-native.sh

      - name: Build the complete native modem for Android (no source stubs)
        run: >
          cargo build --locked -p tempo-fast-sys --lib
          --target aarch64-linux-android
          --target-dir target/android-native-cargo
          --message-format=json-render-diagnostics
          > target/android-native-build.jsonl

      - name: Link the whole modem and check Android dependencies and 16 KiB alignment
        run: node scripts/android-native-link.mjs

      # Native binary distribution waits for the complete runtime NOTICE/source audit.
      - name: Upload native-link evidence and staged licenses (NOT an APK)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-arm64-native-modem-checkpoint
          if-no-files-found: error
          retention-days: 14
          path: |
            target/android-native-linked/link-report.json
            target/android-native-deps/prefix/licenses/

      # Reuse the exact model already reviewed/staged by the desktop CI, not a
      # model-missing override. Public release downloads need no token or key.
      - name: Stage and verify the real AI CW model and its existing license
        shell: bash
        run: |
          set -euo pipefail
          directory=src-tauri/resources/deepcw
          test -s "$directory/LICENSE.AGPL-3.0.txt"
          for file in model.onnx model.onnx.json; do
            curl --fail --show-error --location --retry 3 --proto '=https' \
              "https://github.com/kd9taw/Nexus/releases/download/deepcw-model-v1/$file" \
              -o "$directory/$file"
          done
          echo "a7b3b4aa2610d3e88b8c7d4420eceee31be2d0ae595b3413264334f3ffb1eab5  $directory/model.onnx" | sha256sum -c -
          echo "b4342157b90229ee7380e165f3d8036179b80d1e6ae02f2557388b7fcd558c01  $directory/model.onnx.json" | sha256sum -c -

      - name: Cross-build and validate real Android OpenSSL (never host libssl)
        run: bash scripts/build-android-openssl.sh

      - name: Upload target OpenSSL link evidence and license (NOT an APK)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-arm64-openssl-checkpoint
          if-no-files-found: error
          retention-days: 14
          path: |
            target/android-openssl/link-report.json
            target/android-native-deps/prefix/licenses/OpenSSL-LICENSE.txt

      - name: Check the full application backend (radio and Yaesu waterfall enabled)
        run: >
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          --target aarch64-linux-android --features radio,yaesu-wf
          --target-dir target/android-native-cargo
