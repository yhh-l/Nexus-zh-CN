# Focused cloud-only startup/storage regression. No APK, JNI runtime or RF claim.
name: Android startup storage policy

on:
  workflow_dispatch:
  push:
    branches: [codex/android-arm64]
    paths:
      - .github/workflows/android-storage.yml
      - src-tauri/src/android_storage.rs
      - src-tauri/src/android_folder_picker/**
      - src-tauri/src/android_panels/**
      - src-tauri/gen/android/**
      - scripts/android-folder-harness/**
      - src-tauri/src/lib.rs
      - scripts/android-platform.test.mjs
      - src-tauri/src/lan_client.rs
      - src-tauri/src/lan_client/**
      - src-tauri/src/client_mode.rs
      - src-tauri/src/remote_service/vault.rs
      - src-tauri/src/client_mode/tests.rs
      - src-tauri/src/client_mode/station_boundary.rs
      - src-tauri/src/login_start.rs
      - src-tauri/src/remote_window.rs
      - src-tauri/src/window_state.rs
      - src-tauri/src/window_state/**

permissions:
  contents: read

concurrency:
  group: android-storage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  storage-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.93.1
          components: rustfmt
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify startup ordering and source-boundary negative controls
        run: node --test scripts/android-platform.test.mjs
      - name: Run the actual client-mode station-isolation guards with adapter negative controls
        run: |
          rustc --edition=2021 --test src-tauri/src/client_mode/station_boundary.rs --crate-name client_station_boundary -o "$RUNNER_TEMP/client-station-boundary-tests"
          "$RUNNER_TEMP/client-station-boundary-tests"
      - name: Run actual private-storage filesystem tests (host, not Android execution)
        run: |
          rustc --edition=2021 --test src-tauri/src/android_storage.rs --crate-name android_storage_policy -o "$RUNNER_TEMP/android-storage-tests"
          "$RUNNER_TEMP/android-storage-tests"
      - name: Prove reopening regression catches real data truncation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          source = pathlib.Path('src-tauri/src/android_storage.rs').read_text()
          needle = '        std::fs::create_dir_all(&data)?;'
          assert source.count(needle) == 1
          mutant = source.replace(needle, needle + '\n        std::fs::write(data.join("ALL.TXT"), b"wrong")?;')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'android-storage-negative.rs').write_text(mutant)
          PY
          rustc --edition=2021 --test "$RUNNER_TEMP/android-storage-negative.rs" --crate-name android_storage_negative -o "$RUNNER_TEMP/android-storage-negative-tests"
          set +e
          "$RUNNER_TEMP/android-storage-negative-tests" --exact tests::real_private_directories_are_writable_and_survive_reopening > "$RUNNER_TEMP/storage-negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/storage-negative.log"
          if [[ "$status" != 101 ]]; then
            echo "Expected an actual Rust assertion failure, got $status" >&2
            exit 1
          fi
          grep -F 'test tests::real_private_directories_are_writable_and_survive_reopening ... FAILED' "$RUNNER_TEMP/storage-negative.log"
      - name: Test the actual selected-directory policy without opening a station
        run: |
          rustc --edition=2021 --test src-tauri/src/android_folder_picker/policy.rs --crate-name android_folder_policy -o "$RUNNER_TEMP/android-folder-tests"
          "$RUNNER_TEMP/android-folder-tests"
          rustc --edition=2021 --test src-tauri/src/android_folder_picker/requests.rs --crate-name android_folder_requests -o "$RUNNER_TEMP/android-folder-request-tests"
          "$RUNNER_TEMP/android-folder-request-tests"
      - name: Prove stale-callback ownership tests reject a real guard mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          source = pathlib.Path('src-tauri/src/android_folder_picker/requests.rs').read_text()
          assert source.count('*active == id') == 1
          pathlib.Path(os.environ['RUNNER_TEMP'], 'folder-request-negative.rs').write_text(source.replace('*active == id', '*active != id'))
          PY
          rustc --edition=2021 --test "$RUNNER_TEMP/folder-request-negative.rs" --crate-name folder_request_negative -o "$RUNNER_TEMP/folder-request-negative-tests"
          set +e
          "$RUNNER_TEMP/folder-request-negative-tests" --exact tests::old_callbacks_and_cancellation_cannot_complete_a_new_request > "$RUNNER_TEMP/folder-request-negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/folder-request-negative.log"
          test "$status" = 101
          grep -F 'test tests::old_callbacks_and_cancellation_cannot_complete_a_new_request ... FAILED' "$RUNNER_TEMP/folder-request-negative.log"
      - name: Test actual app-private panel component policy
        run: |
          rustc --edition=2021 --test src-tauri/src/android_panels/policy.rs --crate-name android_panel_policy -o "$RUNNER_TEMP/android-panel-tests"
          "$RUNNER_TEMP/android-panel-tests"
      - name: Check actual pinned shell formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Verify dependency notices against locked upstream packages
        run: python3 scripts/gen-rust-licenses.py --check
      - name: Preserve formatter source patch on failure without committing it
        if: failure()
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff -- src-tauri/src > "$RUNNER_TEMP/android-storage-format.patch"
      - name: Upload diagnostics only, never an APK
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-storage-source-diagnostics
          path: |
            ${{ runner.temp }}/android-storage-format.patch
            ${{ runner.temp }}/storage-negative.log
            ${{ runner.temp }}/folder-request-negative.log
          if-no-files-found: warn
          retention-days: 7

  native-folder-ui:
    name: Actual native folder + viewport Kotlin framework-modeled tests (not APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Java 17 only on the GitHub runner
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Bootstrap only the pinned cloud Gradle tool, with both wrapper and distribution checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          mkdir -p scripts/android-folder-harness/gradle/wrapper
          cp src-tauri/gen/android/gradlew scripts/android-folder-harness/gradlew
          cp src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties scripts/android-folder-harness/gradle/wrapper/
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/tauri-apps/tauri/tauri-cli-v2.11.5/crates/tauri-cli/templates/mobile/android/gradle/wrapper/gradle-wrapper.jar' -o scripts/android-folder-harness/gradle/wrapper/gradle-wrapper.jar
          echo 'e996d452d2645e70c01c11143ca2d3742734a28da2bf61f25c82bdc288c9e637  scripts/android-folder-harness/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          grep -Fx 'distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531' scripts/android-folder-harness/gradle/wrapper/gradle-wrapper.properties
      - name: Prove actual native inset tests reject removal of the product padding application
        working-directory: scripts/android-folder-harness
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/src-tauri/gen/android/app/src/main/java/com/kd9taw/tempo/NexusWindowInsets.kt"
          backup=$(mktemp "$RUNNER_TEMP/nexus-insets.XXXXXX")
          cp "$source" "$backup"
          restore() { cp "$backup" "$source"; }
          trap restore EXIT
          python3 - <<'PY'
          from pathlib import Path
          source = Path('../../src-tauri/gen/android/app/src/main/java/com/kd9taw/tempo/NexusWindowInsets.kt')
          text = source.read_text()
          needle = '      content.setPadding(left, top, right, bottom)'
          if text.count(needle) != 1:
              raise ValueError('Negative control must mutate the actual product inset application')
          source.write_text(text.replace(needle, '      // negative control: content padding application removed'))
          PY
          set +e
          bash ./gradlew --no-daemon --stacktrace testDebugUnitTest --tests '*NexusWindowInsetsTest' > "$RUNNER_TEMP/insets-negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/insets-negative.log"
          test "$status" -ne 0
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('build/test-results/testDebugUnitTest/TEST-com.kd9taw.tempo.NexusWindowInsetsTest.xml')
          suite = ET.parse(report).getroot()
          assert int(suite.get('tests', '0')) >= 5, 'The actual inset tests did not execute'
          assert int(suite.get('failures', '0')) > 0, 'Removed inset application was not detected'
          assert int(suite.get('errors', '0')) == 0, 'Compilation/framework errors are not a passing negative control'
          PY
          restore
      - name: Prove the native permission test rejects bypassing actual Android authority
        working-directory: scripts/android-folder-harness
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/src-tauri/gen/android/app/src/main/java/com/kd9taw/tempo/NexusLaunchActivity.kt"
          backup=$(mktemp "$RUNNER_TEMP/nexus-permission.XXXXXX")
          cp "$source" "$backup"
          restore() { cp "$backup" "$source"; }
          trap restore EXIT
          python3 - <<'PY'
          from pathlib import Path
          source = Path('../../src-tauri/gen/android/app/src/main/java/com/kd9taw/tempo/NexusLaunchActivity.kt')
          text = source.read_text()
          needle = '    if (hasMicrophone()) openMain()'
          if text.count(needle) != 1:
              raise ValueError('Negative control must mutate actual OS permission recheck')
          source.write_text(text.replace(needle, '    if (true) openMain()'))
          PY
          set +e
          bash ./gradlew --no-daemon --stacktrace testDebugUnitTest --tests '*NexusLaunchActivityTest.deniedOrForgedCallbackDoesNotGrantPermissionOrStartTauri' > "$RUNNER_TEMP/permission-negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/permission-negative.log"
          test "$status" -ne 0
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('build/test-results/testDebugUnitTest/TEST-com.kd9taw.tempo.NexusLaunchActivityTest.xml')
          suite = ET.parse(report).getroot()
          assert int(suite.get('tests', '0')) == 1, 'Actual permission test did not execute'
          assert int(suite.get('failures', '0')) == 1, 'OS permission bypass was not detected'
          assert int(suite.get('errors', '0')) == 0, 'Framework errors do not prove permission enforcement'
          assert suite.find('testcase/failure').get('type') == 'java.lang.AssertionError'
          PY
          restore
      - name: Compile actual product folder/viewport controllers and run native modeled tests
        working-directory: scripts/android-folder-harness
        run: bash ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Preserve actual native test reports, never a candidate APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-folder-test-reports
          path: |
            scripts/android-folder-harness/build/reports/tests/
            scripts/android-folder-harness/build/test-results/
          if-no-files-found: warn
          retention-days: 7
